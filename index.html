<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>최효주 워홀 & 일상 일지</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nanum Pen Script', cursive;
      background-color: #fff0f5;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #ffb6c1;
      padding: 25px;
      text-align: center;
      color: white;
    }
    header h1 { margin: 0; font-size: 2.2em; }
    nav { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
    nav a {
      text-decoration: none; color: white; font-weight: bold;
      padding: 5px 12px; border-radius: 5px; transition: background 0.3s;
    }
    nav a:hover { background-color: #ff69b4; }
    main {
      display: flex; flex-wrap: wrap; justify-content: center; margin: 25px; gap: 20px;
    }
    .card {
      background-color: #fff; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 20px; width: 260px; text-align: center; transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-5px); }
    .card h2 { color: #ff69b4; }
    .card p { font-size: 0.9em; }
    .card a {
      display: inline-block; margin-top: 10px; padding: 5px 10px;
      background-color: #ffb6c1; color: white; text-decoration: none;
      border-radius: 5px; transition: background 0.3s;
    }
    .card a:hover { background-color: #ff69b4; }
    footer { text-align: center; margin: 30px 0; font-size: 0.8em; color: #999; }
  </style>
</head>
<body>
  <header>
    <h1>🐹 최효주 워홀 & 일상 일지</h1>
    <nav>
      <a href="plan/checklist.md">체크리스트</a>
      <a href="logs/example-log.md">일지</a>
      <a href="resources/example.md">자료</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>📋 체크리스트</h2>
      <p>워홀 준비 상황을 한눈에 확인할 수 있어요!</p>
      <a href="plan/checklist.md">열기</a>
    </div>
    <div class="card">
      <h2>📝 최신 일지</h2>
      <p>2025-12-01: 워홀 준비 시작 ✅</p>
      <p>2025-12-03: 비자 정보 조사 📝</p>
      <a href="logs/example-log.md">자세히 보기</a>
    </div>
    <div class="card">
      <h2>📚 자료 모음</h2>
      <p>워홀 관련 유용한 정보와 링크를 정리했어요!</p>
      <a href="resources/example.md">열기</a>
    </div>
  </main>

  <footer>
    &copy; 2025 최효주
  </footer>
</body>
</html>
